name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'package.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'public/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-24.04
    environment: dev
    defaults:
      run:
        working-directory: .

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Check Artifact Registry region and project
        run: |
          R="${{ secrets.GCP_RUN_REGION }}"
          R="${R%-docker.pkg.dev}"
          if [ -z "$R" ]; then
            echo "::error::GCP_RUN_REGION is empty. Add it to the workflow environment (e.g. dev) or repo secrets — value like us-central1 (no suffix)."
            exit 1
          fi
          P="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$P" ]; then P="${GOOGLE_CLOUD_PROJECT:-}"; fi
          if [ -z "$P" ]; then
            echo "::error::GCP_PROJECT_ID is empty and GOOGLE_CLOUD_PROJECT is unset. Add secret GCP_PROJECT_ID (e.g. howdy-app-123) to the dev environment or repo."
            exit 1
          fi
          echo "GCP_RUN_REGION=$R"
          echo "GCP_PROJECT_ID=$P"
          {
            echo "GCP_RUN_REGION_NORM=$R"
            echo "GCP_PROJECT_RESOLVED=$P"
          } >> "$GITHUB_ENV"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_RUN_REGION_NORM}-docker.pkg.dev" -q

      - name: Compute image name
        id: meta
        run: |
          REPO="${{ secrets.GCP_ARTIFACT_REPOSITORY }}"
          if [ -z "$REPO" ]; then REPO="howdy"; fi
          IMAGE="${GCP_RUN_REGION_NORM}-docker.pkg.dev/${GCP_PROJECT_RESOLVED}/$REPO/howdy-backend:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build container
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Push container
        run: docker push "${{ steps.meta.outputs.image }}"

      - name: Deploy to Cloud Run
        env:
          SERVICE: ${{ secrets.GCP_RUN_SERVICE }}
          REGION: ${{ env.GCP_RUN_REGION_NORM }}
          IMAGE: ${{ steps.meta.outputs.image }}
          # Runtime env (optional, set in repo/env secrets)
          NODE_ENV: production
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          INVITE_LANDING_BASE_URL: ${{ vars.INVITE_LANDING_BASE_URL }}
          ENABLE_TRANSCRIPT_BACKFILL: ${{ secrets.ENABLE_TRANSCRIPT_BACKFILL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
          AGORA_REC_CUSTOMER_ID: ${{ secrets.AGORA_REC_CUSTOMER_ID }}
          AGORA_REC_CUSTOMER_CERT: ${{ secrets.AGORA_REC_CUSTOMER_CERT }}
          AGORA_REC_REGION: ${{ secrets.AGORA_REC_REGION }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ secrets.GCS_PREFIX }}
          GCS_INTEROP_ACCESS_KEY: ${{ secrets.GCS_INTEROP_ACCESS_KEY }}
          GCS_INTEROP_SECRET_KEY: ${{ secrets.GCS_INTEROP_SECRET_KEY }}
          TRANSCRIPTS_PREFIX: ${{ secrets.TRANSCRIPTS_PREFIX }}
          ARCHIVE_TRANSCRIPTS_TO_GCS: ${{ secrets.ARCHIVE_TRANSCRIPTS_TO_GCS }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          ASSEMBLYAI_WEBHOOK_SECRET: ${{ secrets.ASSEMBLYAI_WEBHOOK_SECRET }}
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_BUCKET: ${{ secrets.FIREBASE_BUCKET }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          YOTI_ENV: ${{ secrets.YOTI_ENV }}
          YOTI_CLIENT_SDK_ID: ${{ secrets.YOTI_CLIENT_SDK_ID }}
          YOTI_KEY_PEM_B64: ${{ secrets.YOTI_KEY_PEM_B64 }}
          YOTI_SUCCESS_URL: ${{ secrets.YOTI_SUCCESS_URL }}
          YOTI_ERROR_URL: ${{ secrets.YOTI_ERROR_URL }}
          YOTI_WEBHOOK_AUTH: ${{ secrets.YOTI_WEBHOOK_AUTH }}
        run: |
          set -euo pipefail
          svc="${SERVICE:-howdy-backend}"
          if [ -z "${REGION:-}" ]; then
            echo "GCP_RUN_REGION_NORM is unset (check GCP_RUN_REGION secret)"; exit 1
          fi
          # Build env list dynamically (include only non-empty)
          ENV_LIST="NODE_ENV=production"
          add_var() { v="$1"; val="${!v:-}"; if [ -n "$val" ]; then val="${val//,/\\,}"; ENV_LIST="$ENV_LIST,$v=$val"; fi }
          for v in PUBLIC_BASE_URL API_BASE_URL INVITE_LANDING_BASE_URL \
 ENABLE_TRANSCRIPT_BACKFILL JWT_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
                   AGORA_APP_ID AGORA_APP_CERTIFICATE AGORA_REC_CUSTOMER_ID AGORA_REC_CUSTOMER_CERT AGORA_REC_REGION \
                   GCS_BUCKET GCS_PREFIX GCS_INTEROP_ACCESS_KEY GCS_INTEROP_SECRET_KEY \
                   TRANSCRIPTS_PREFIX ARCHIVE_TRANSCRIPTS_TO_GCS \
                   ASSEMBLYAI_API_KEY ASSEMBLYAI_WEBHOOK_SECRET REVENUECAT_KEY \
                   SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS OPENAI_API_KEY FIREBASE_BUCKET PII_ENCRYPTION_KEY \
                   YOTI_ENV YOTI_CLIENT_SDK_ID YOTI_KEY_PEM_B64 YOTI_SUCCESS_URL YOTI_ERROR_URL YOTI_WEBHOOK_AUTH; do
            add_var "$v"
          done
          gcloud run deploy "$svc" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 5000 \
            --set-env-vars "$ENV_LIST"

